services:
  - type: web
    name: ai-password-analyzer-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      # Comma-separated frontend origins, e.g. the Vercel production URL.
      - key: CORS_ORIGINS
        sync: false
